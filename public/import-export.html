<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>GRIDDELTA — Імпорт / Експорт</title></head>
<body style="margin:0;background:#0b1220;color:#8b9bb4;font-family:system-ui">
<p id="s" style="padding:24px">Завантаження дашборду…</p>
<script>
(async()=>{
  try{
    const r=await fetch("/import-export-app.html",{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status+". Додайте public/import-export-app.html");
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("s").innerHTML="Помилка: "+e+"<br/><br/>Відкрийте <a href='/import-export-app.html' style='color:#60a5fa'>/import-export-app.html</a> напряму або покладіть GRIDDELTA.html як public/import-export-app.html";
  }
})();
</script>
</body></html>
